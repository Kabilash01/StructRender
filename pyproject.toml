[project]
name = "structrender"
version = "0.0.0"
description = "Engine-grounded neural game rendering with Engine-Keyed Persistent Appearance Memory (EPAM)"
requires-python = ">=3.10"
# Runtime/training dependencies are added milestone by milestone (KB §10),
# starting at Milestone 2 (dataset pipeline).
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Milestone 3 offline teacher (SD 1.5 + ControlNet-depth, KB Decision 31).
# Deliberately NOT a core dependency: the `deterministic` CI teacher, the cache
# and the whole alignment validator must run on a clean checkout without them.
teacher = [
    "torch>=2.5",
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
# Milestone 4 renderer training (CNN/U-Net baseline, ladder Model A).
# `lpips` is the reference LPIPS implementation (KB §11 image-quality metric);
# it pulls torchvision and fetches AlexNet weights on first use, so it stays
# optional — without it SSIM/PSNR are reported and LPIPS is reported as
# unavailable rather than approximated.
train = [
    "torch>=2.5",
    "lpips>=0.1.4",
]
# Milestone 4 ONNX export smoke test (KB §12 operator-compatibility check).
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
